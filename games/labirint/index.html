<title>Лабиринт вслепую</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a14;--stone:#2a2438;--amber:#ffb347;--flame:#ff7a1a;--parch:#e9d8a6;--ink:#3b2a1a;--teal:#7fe8d8;--red:#e0483a;--vio:#a37cf0;
--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:#f3e9d2;font-family:"Philosopher",Georgia,"Times New Roman",serif;overflow:hidden;overscroll-behavior:none;position:fixed;width:100%}
.duo-ov[hidden]{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation}
section{position:absolute;inset:0;display:none}
section.on{display:flex}
/* ---------- title ---------- */
#title{flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + var(--sat)) calc(20px + var(--sar)) calc(16px + var(--sab)) calc(20px + var(--sal));
 background:radial-gradient(ellipse at 50% 28%,#4a2c14 0,#1b1226 38%,#0c0a14 75%)}
#title:before{content:"";position:absolute;inset:0;opacity:.07;background:
 repeating-linear-gradient(0deg,#fff 0 2px,transparent 2px 46px),repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 46px);
 -webkit-mask:radial-gradient(circle at 50% 30%,transparent 0,#000 80%);mask:radial-gradient(circle at 50% 30%,transparent 0,#000 80%)}
.logo{position:relative;text-align:center;line-height:.95}
.logo b{display:block;font-size:min(15vw,14vh,74px);letter-spacing:.06em;color:var(--amber);text-shadow:0 0 18px rgba(255,140,40,.7),0 3px 0 #6b3510;animation:fl 2.4s infinite}
.logo i{display:block;font-style:normal;font-size:min(8vw,7vh,34px);color:var(--parch);letter-spacing:.35em;margin-top:6px;opacity:.9}
@keyframes fl{0%,100%{filter:brightness(1)}20%{filter:brightness(1.18)}45%{filter:brightness(.92)}70%{filter:brightness(1.1)}}
.candle{width:46px;height:78px}
.candle .fl{transform-origin:50% 100%;animation:wob 1.3s infinite ease-in-out}
@keyframes wob{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.92,1.08) skewX(4deg)}60%{transform:scale(1.05,.95) skewX(-4deg)}}
.btn{position:relative;min-height:54px;padding:12px 22px;border-radius:14px;border:2px solid var(--amber);background:linear-gradient(#3a2a20,#21171a);color:var(--parch);font-size:20px;font-weight:700;letter-spacing:.02em;box-shadow:0 4px 0 #0007,inset 0 0 14px rgba(255,150,50,.15);cursor:pointer}
.btn:active{transform:translateY(2px)}
.btn.hot{background:linear-gradient(#ffc169,#e38a22);color:#2b1706;border-color:#ffd9a0}
.btn.small{min-height:44px;font-size:16px;padding:8px 14px}
.menu{display:flex;flex-direction:column;gap:12px;width:min(340px,86vw)}
.how{max-width:340px;text-align:center;font-size:14px;line-height:1.35;opacity:.75}
.back{position:absolute;left:calc(14px + var(--sal));top:calc(10px + var(--sat));color:var(--parch);opacity:.8;text-decoration:none;font-size:16px;padding:10px 6px;z-index:3}
#mute{position:absolute;right:calc(14px + var(--sar));top:calc(10px + var(--sat));width:46px;height:46px;border-radius:50%;border:2px solid #ffffff30;background:#0006;font-size:22px;z-index:3}
@media (orientation:landscape) and (max-height:480px){#title{flex-direction:row;flex-wrap:wrap;gap:8px 28px}.candle,.how{display:none}.logo b{font-size:46px}.logo i{font-size:20px}.menu{width:300px}}
/* ---------- select ---------- */
#select{flex-direction:column;background:linear-gradient(#150f1f,#0c0a14);padding:calc(8px + var(--sat)) calc(12px + var(--sar)) calc(8px + var(--sab)) calc(12px + var(--sal))}
#selTop{display:flex;align-items:center;gap:10px;min-height:52px}
#selTop h2{margin:0;flex:1;font-size:22px;color:var(--amber);text-align:center}
#selTop .btn{min-height:44px;padding:6px 14px;font-size:17px}
#roleBar{text-align:center;font-size:14px;opacity:.85;padding:2px 0 6px;min-height:22px}
#grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:start;padding:4px 2px 12px}
@media (orientation:landscape){#grid{grid-template-columns:repeat(10,1fr);gap:6px}.card{aspect-ratio:1/.95;font-size:22px}.card small{font-size:9px;line-height:1.05;text-align:center}.card .st{font-size:11px}}
.card{position:relative;aspect-ratio:1/1.05;border-radius:12px;border:2px solid #6b5a46;background:linear-gradient(#2d2230,#1a1320);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:26px;font-weight:700;color:var(--parch);cursor:pointer;padding:0}
.card small{font-size:12px;opacity:.7;font-weight:400;line-height:1}
.card .st{font-size:13px;color:#ffd24a;letter-spacing:1px;min-height:15px}
.card.lock{opacity:.4;filter:grayscale(.8)}
.card.cur{border-color:var(--amber);box-shadow:0 0 12px rgba(255,170,60,.5)}
.card .ro{position:absolute;top:3px;right:5px;font-size:13px}
/* ---------- game ---------- */
#game{display:none;background:#08060d;touch-action:none;
 grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"hud" "stage" "ctl"}
#game.on{display:grid}
#hud{grid-area:hud;display:flex;align-items:center;gap:8px;padding:calc(6px + var(--sat)) calc(10px + var(--sar)) 6px calc(10px + var(--sal));background:#120d1a;border-bottom:1px solid #ffffff14;font-size:16px;min-height:50px;flex-wrap:wrap}
#hud .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--amber)}
#hud .it{white-space:nowrap}
.ib{width:42px;height:42px;border-radius:50%;border:2px solid #ffffff30;background:#0006;font-size:19px;padding:0;flex:none}
#stage{grid-area:stage;position:relative;min-height:0;min-width:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#000b;border:1px solid #ffffff30;border-radius:20px;padding:6px 16px;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#ctl{grid-area:ctl;padding:8px calc(10px + var(--sar)) calc(10px + var(--sab)) calc(10px + var(--sal));background:#120d1a;border-top:1px solid #ffffff14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#dpad{display:none;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,72px);gap:6px}
#dpad.on{display:grid}
#dpad button{border-radius:18px;border:2px solid #ffb34780;background:linear-gradient(#3a2a20,#21171a);font-size:30px;color:var(--amber);padding:0;touch-action:none}
#dpad button.dn{background:#ffb347;color:#2b1706}
#dpad .u{grid-area:1/2}#dpad .l{grid-area:2/1}#dpad .r{grid-area:2/3}#dpad .d{grid-area:3/2}
#navp{display:none;flex-direction:column;gap:8px;width:100%;align-items:center}
#navp.on{display:flex}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tb{width:48px;height:48px;border-radius:12px;border:2px solid #7fe8d855;background:#1c2530;color:var(--teal);font-size:24px;padding:0;line-height:1}
.tb.sel{background:var(--teal);color:#06201c;border-color:#fff}
.sw{min-width:64px;height:48px;border-radius:24px;border:2px solid #ffb34780;background:#2a1d17;color:#ffcf8a;font-size:18px;font-weight:700;padding:0 14px;display:flex;align-items:center;gap:6px}
.sw i{width:14px;height:14px;border-radius:50%;background:#4a3a30;display:inline-block;box-shadow:inset 0 0 3px #000}
.sw.on i{background:#ffd24a;box-shadow:0 0 10px #ffb347}
.sw.on{background:#4a3016}
#soloBtns{display:none;gap:8px}
#soloBtns.on{display:flex}
@media (orientation:landscape){
 #game.on{grid-template-columns:1fr 232px;grid-template-rows:auto 1fr;grid-template-areas:"stage hud" "stage ctl"}
 #hud{padding:calc(6px + var(--sat)) calc(10px + var(--sar)) 6px 10px;border-left:1px solid #ffffff14}
 #ctl{padding:6px calc(10px + var(--sar)) calc(8px + var(--sab)) 10px;border-left:1px solid #ffffff14}
 #stage{margin-left:var(--sal)}
 #hud .nm{order:5;flex-basis:100%;font-size:15px}
 #dpad{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:5px}
 .tb{width:44px;height:44px;font-size:22px}
}
/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px calc(16px + var(--sar)) calc(16px + var(--sab)) calc(16px + var(--sal));background:rgba(8,6,13,.8)}
.ov.on{display:flex}
.pn{width:min(380px,100%);max-height:100%;overflow-y:auto;background:linear-gradient(#2b2030,#171020);border:2px solid var(--amber);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 0 40px rgba(255,140,40,.25)}
.pn h3{margin:0;font-size:26px;color:var(--amber)}
.pn p{margin:0;font-size:16px;line-height:1.35;color:#eadfc6}
.pn .big{font-size:42px;letter-spacing:6px;color:#ffd24a}
.pn .stats{display:flex;justify-content:space-around;font-size:17px}
#pause{z-index:30;font-size:22px;text-align:center;color:var(--parch)}
</style>
</head>

function prepare(L){

  L.fa=L.f.split(''); L.ready=1; return L;

function fch(L,x,y){return L.fa[y*L.w+x];}

function gateOpen(c,gm){
  if(c>='1'&&c<='3') return ((gm>>(c.charCodeAt(0)-49))&1)===1;
  if(c>='5'&&c<='7') return ((gm>>(c.charCodeAt(0)-53))&1)===0;
  return true;
}

  if(!gateOpen(c,gm)) return null;
  if(ARROWS[c]!==undefined&&ARROWS[c]!==d) return null;
  return [nx,ny];

function teleDest(L,x,y){
  const o=TELE_OTHER[fch(L,x,y)]; if(!o) return null;
  const i=L.fa.indexOf(o); return i<0?null:[i%L.w,(i/L.w)|0];

function parOf(ticks){return Math.round(18+ticks*TICK/1000*3);}

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const NL=20;
// ---------- storage / progress ----------
let prog={u:1,b:{},t:{}};
try{const j=JSON.parse(localStorage.getItem('labirint.v1'));if(j&&j.u)prog=Object.assign(prog,j);}catch(e){}
function saveProg(){try{localStorage.setItem('labirint.v1',JSON.stringify(prog));}catch(e){}}
function mergeProg(p){
  if(!p||typeof p!=='object')return false;let ch=false;
  if(p.u>prog.u){prog.u=Math.min(NL,p.u|0);ch=true;}
  for(const k in (p.b||{})){if((p.b[k]|0)>(prog.b[k]|0)){prog.b[k]=p.b[k]|0;ch=true;}}
  for(const k in (p.t||{})){if(p.t[k]>0&&(!(prog.t[k]>0)||p.t[k]<prog.t[k])){prog.t[k]=p.t[k];ch=true;}}
  if(ch){saveProg();}return ch;
}
let muted=false;try{muted=localStorage.getItem('labirint.mute')==='1';}catch(e){}
// ---------- audio ----------
let ac=null;
function initAudio(){if(ac){if(ac.state==='suspended')ac.resume();return;}try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tone(f,d,type,vol,slide,delay){
  if(!ac||muted)return;const t=ac.currentTime+(delay||0);const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.15,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.05);
}
const SFX={
 step(){tone(150+Math.random()*30,.06,'triangle',.08,90);},
 bump(){tone(90,.08,'square',.05,60);},
 key(){[660,880,1320].forEach((f,i)=>tone(f,.15,'triangle',.14,0,i*.07));},
 gem(){tone(1046,.12,'sine',.15);tone(1568,.25,'sine',.13,0,.08);},
 door(){tone(200,.25,'sawtooth',.08,120);},
 die(){tone(400,.5,'sawtooth',.14,60);},
 win(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,.3,'triangle',.15,0,i*.1));},
 sw(){tone(300,.06,'square',.08,600);tone(500,.08,'square',.06,250,.06);},
 mark(){tone(700,.07,'sine',.1,1000);},
 tele(){tone(300,.3,'sine',.12,1200);},
 gate(){tone(120,.25,'sawtooth',.07,70);},
 tick(){tone(1000,.05,'sine',.08);}
};
function setMuteUI(){$('mute').textContent=$('gMute').textContent=muted?'🔇':'🔊';}
function toggleMute(){muted=!muted;try{localStorage.setItem('labirint.mute',muted?'1':'0');}catch(e){}setMuteUI();}
setMuteUI();$('mute').onclick=$('gMute').onclick=()=>{initAudio();toggleMute();};
document.addEventListener('pointerdown',initAudio,{passive:true});document.addEventListener('keydown',initAudio);
// ---------- state ----------
let net=false, screen='title';
let sw=false;                       // поменять роли
let curEp=0, curLvl=0, role='solo', L=null, fa=null, ep0=0;
let paused=false, pst=null;
let W,NV,SO;                         // walker / navigator / solo
let T0=0;                           // служебное
function role4(level){const hostW=((level%2)===1)!==!!sw;return Duo.isHost()?(hostW?'walker':'nav'):(hostW?'nav':'walker');}
// ---------- screens ----------
function show(s){screen=s;['title','select','game'].forEach(n=>$(n).classList.toggle('on',n===s));}
function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),ms||1800);}
// ---------- select ----------
function stars(n){return '★'.repeat(n)+'☆'.repeat(3-n);}
function buildSelect(){
  const g=$('grid');g.innerHTML='';
  for(let i=1;i<=NL;i++){
    const b=document.createElement('button');const open=i<=prog.u;
    b.className='card'+(open?'':' lock')+(i===prog.u?' cur':'');
    const r=net?role4(i):'';
    b.innerHTML=(net?'<span class="ro">'+(r==='walker'?'🕯':'🗺')+'</span>':'')+(open?i:'🔒')+'<small>'+(open?LEVELS[i-1].name:'')+'</small><span class="st">'+(open?stars(prog.b[i]|0):'')+'</span>';
    b.style.fontSize='';
    if(open)b.onclick=()=>pickLevel(i);
    g.appendChild(b);
  }
  $('selSwap').style.display=net?'':'none';
  $('roleBar').textContent=net?(Duo.isHost()?'Ты — игрок 1. ':'Ты — игрок 2. ')+'🕯 Путник идёт · 🗺 Штурман видит карту · ⇄ меняет роли':'';
}
function goSelect(){mode_leave();show('select');buildSelect();}
function mode_leave(){hideOv();}
function newEp(){const pe=(net&&Duo.partner()&&Duo.partner().sel&&Duo.partner().sel.ep)||0;const me=(Duo.mine().sel&&Duo.mine().sel.ep)||0;return Math.max(Date.now(),pe+1,me+1);}
function pickLevel(n){
  initAudio();
  if(!net){startLevel(n,Date.now(),true);return;}
  const s={level:n,ep:newEp(),sw:sw?1:0};Duo.set({sel:s});applySel();
}
function leaveToSelect(){
  if(!net){goSelect();return;}
  Duo.set({sel:{level:0,ep:newEp(),sw:sw?1:0}});applySel();
}
function applySel(){
  if(!net)return;
  const a=Duo.mine().sel,b=pst&&pst.sel;let s=a;if(b&&(!a||b.ep>a.ep))s=b;
  if(!s||s.ep===curEp)return;
  curEp=s.ep;sw=!!s.sw;
  if(s.level>0&&s.level<=NL)startLevel(s.level,s.ep,false);else{curLvl=0;goSelect();}
}
$('selBack').onclick=()=>{if(net){Duo.leave();net=false;}show('title');};
$('selSwap').onclick=()=>{sw=!sw;Duo.set({sel:{level:0,ep:newEp(),sw:sw?1:0}});applySel();toast(sw?'Роли поменялись':'Роли как были');};
$('bSolo').onclick=()=>{initAudio();net=false;goSelect();};
$('bNet').onclick=async()=>{
  initAudio();
  try{await Duo.pair();}catch(e){return;}
  net=true;curEp=0;pst=Duo.partner();
  Duo.set({prog});mergeProg(pst&&pst.prog);
  goSelect();applySel();
};
$('gBack').onclick=()=>{leaveToSelect();};
// ---------- level start ----------
let held=[],want=-1,lastBump=0,tickN=0,navTool=1,tIdx=0,finShown=0;
function startLevel(n,ep,solo){
  curLvl=n;ep0=ep;L=prepare(JSON.parse(JSON.stringify(LEVELS[n-1])));fa=L.fa.slice();
  role=solo?'solo':role4(n);finShown=0;held=[];want=-1;
  W={x:L.s[0],y:L.s[1],px:L.s[0],py:L.s[1],k:0,gs:new Set(),d:0,cp:[L.s[0],L.s[1]],dead:0,lt:0,go:0,fin:null,steps:0,flash:0,pen:0,tele:0};
  NV={gm:0,marks:[],ready:0,tool:1,off:-1e9,nlt:0,walk:{x:L.s[0],y:L.s[1]},seenD:0};
  SO={mem:0,gm:0,peek:0};
  tickN=0;
  if(net){
    Duo.set({r:ep,rdy:null,go:null,fin:null,x:null,y:null,k:null,g:null,dd:null,lt:null,gm:null,mk:null,e:null});
  }
  show('game');
  $('hName').textContent=n+'. '+L.name;
  $('dpad').classList.toggle('on',role==='walker'||role==='solo');
  $('navp').classList.toggle('on',role==='nav');
  $('soloBtns').classList.toggle('on',role==='solo');
  buildCtl();resize();
  if(role==='solo'){SO.mem=3+L.w*0.5;W.go=0;}
  openIntro();
  updateHud();
}
function buildCtl(){
  const tl=$('tools');tl.innerHTML='';
  const tools=[['↑',1],['→',2],['↓',3],['←',4],['✖',5],['★',6],['⌫',0]];
  tools.forEach(([g,v])=>{const b=document.createElement('button');b.className='tb'+(v===NV.tool?' sel':'');b.textContent=g;b.onclick=()=>{NV.tool=v;buildCtl();};tl.appendChild(b);});
  const cl=document.createElement('button');cl.className='tb';cl.textContent='🧹';cl.onclick=()=>{NV.marks=[];pushNav();SFX.mark();};tl.appendChild(cl);
  const s=$('sws');s.innerHTML='';
  for(let j=0;j<(L.ns||0);j++){
    const b=document.createElement('button');b.className='sw'+(((role==='solo'?SO.gm:NV.gm)>>j)&1?' on':'');b.innerHTML='<i></i>'+(j+1);b.onclick=()=>toggleSwitch(j);s.appendChild(b);
  }
  const sb=$('soloBtns');sb.innerHTML='';
  if(role==='solo'){
    for(let j=0;j<(L.ns||0);j++){const b=document.createElement('button');b.className='sw'+((SO.gm>>j)&1?' on':'');b.innerHTML='<i></i>'+(j+1);b.onclick=()=>toggleSwitch(j);sb.appendChild(b);}
    const p=document.createElement('button');p.className='sw';p.textContent='👁 +5с';p.onpointerdown=()=>{if(W.go&&!W.fin){SO.peek=2200;W.pen+=5000;SFX.tick();}};sb.appendChild(p);
  }
}
function toggleSwitch(j){
  if(role==='nav'){NV.gm^=(1<<j);pushNav();SFX.sw();}
  else if(role==='solo'){if(!W.go)return;SO.gm^=(1<<j);SFX.sw();}
  buildCtl();
}
function curGm(){return role==='solo'?SO.gm:role==='walker'?((pst&&pst.r===ep0&&pst.gm)|0):NV.gm;}
function openIntro(){
  const r=role;let h='';
  const head='<h3>'+curLvl+'. '+L.name+'</h3>';
  if(r==='walker')h=head+'<p>🕯 Ты — <b>Путник</b>. Ты видишь только пару клеток вокруг. Партнёр видит карту — слушай подсказки и ищи выход.</p>';
  else if(r==='nav')h=head+'<p>🗺 Ты — <b>Штурман</b>. Ты видишь весь лабиринт и Путника. Ставь метки (тап по клетке), жми рычаги и подсказывай голосом.</p>';
  else h=head+'<p>Сейчас карта вспыхнет на несколько секунд — запомни её. Потом лабиринт погаснет. Рычаги внизу — твои.</p>';
  h+='<button class="btn hot" id="rdy">'+(r==='solo'?'Показать карту':'Готов')+'</button>';
  showOv(h);
  $('rdy').onclick=()=>{
    initAudio();
    if(r==='solo'){hideOv();W.go=0;SO.memOn=1;return;}
    NV.ready=1;Duo.set({rdy:1});
    $('rdy').disabled=true;$('rdy').textContent='Ждём партнёра…';
  };
}
function showOv(h){$('pn').innerHTML=h;$('ov').classList.add('on');}
function hideOv(){$('ov').classList.remove('on');}
// ---------- network in ----------
function pushWalker(){
  if(!net)return;
  Duo.set({r:ep0,x:W.x,y:W.y,k:W.k,g:[...W.gs],dd:W.d,lt:Math.round(W.lt),go:W.go,e:W.tele});
}
function pushNav(){if(net)Duo.set({r:ep0,gm:NV.gm,mk:NV.marks});}
function onPartner(p){
  pst=p;
  if(!p)return;
  if(mergeProg(p.prog)){if(net)Duo.set({prog});if(screen==='select')buildSelect();}
  applySel();
  if(screen!=='game'||!L)return;
  if(p.r!==ep0)return;
  if(role==='walker'){
    // gm / marks читаются из pst напрямую
    if(p.rdy&&W.go===0&&NV.ready&&!W.started){startWalker();}
    const gm=p.gm|0;if(gm!==NV.seenD){NV.seenD=gm;SFX.gate();}
  }
  if(role==='nav'){
    if(p.go&&!NV.started){NV.started=1;hideOv();}
    if(p.lt!=null){const rx=performance.now();const o=p.lt-rx;if(o>NV.off)NV.off=o;NV.lastLt=p.lt;}
    if(p.k!=null){
      if(p.k!==W.k&&(p.k&~W.k))SFX.key();
      W.k=p.k;}
    if(p.g){if(p.g.length>W.gs.size)SFX.gem();W.gs=new Set(p.g);}
    if(p.x!=null&&(p.x!==NV.walk.x||p.y!==NV.walk.y)){NV.walk.x=p.x;NV.walk.y=p.y;if(p.e!==NV.te){SFX.tele();}else SFX.step();}
    if(p.e!=null)NV.te=p.e;
    if(p.dd!=null&&p.dd>W.d){W.d=p.dd;W.flash=700;SFX.die();}
    if(p.fin&&p.fin.r===ep0&&!finShown){finShown=1;showResult(p.fin);}
  }
  if(role==='walker'&&!finShown&&false){}
}
function startWalker(){
  W.started=1;W.go=1;W.lt=0;tickN=0;hideOv();pushWalker();
}
Duo.init({game:'labirint',accent:'#ffb347'});
Duo.onState(onPartner);
Duo.onLoss(()=>{if(net){paused=true;$('pause').classList.add('on');}});
Duo.onLink(()=>{if(net){paused=false;$('pause').classList.remove('on');pst=Duo.partner();NV.off=-1e9;}});
// ---------- input ----------
const KEYD={ArrowUp:0,ArrowRight:1,ArrowDown:2,ArrowLeft:3,w:0,d:1,s:2,a:3,W:0,D:1,S:2,A:3};
function dDown(d){if(held.indexOf(d)<0)held.push(d);want=d;}
function dUp(d){held=held.filter(x=>x!==d);}
document.addEventListener('keydown',e=>{
  if(screen!=='game')return;
  if(e.key in KEYD&&(role==='walker'||role==='solo')){e.preventDefault();if(!e.repeat)dDown(KEYD[e.key]);}
  else if(role==='nav'||role==='solo'){
    const n=parseInt(e.key,10);if(n>=1&&n<=(L.ns||0))toggleSwitch(n-1);
    if(role==='nav'&&e.key==='q'){NV.tool=(NV.tool%6)+1;buildCtl();}

    ctx.restore();
    for(const gd of L.g){const p=guardPos(gd,((tms/TICK|0)%PERIOD)*TICK+(tms%TICK));drawGuard(ctx,p[0],p[1],cs,g.ox,g.oy,tms,1);}
    for(const m of marks){const idx=(m/8)|0;drawMark(ctx,m,cs,g.ox+(idx%L.w)*cs,g.oy+((idx/L.w)|0)*cs,true,tms,.95);}
    // walker
    const wx=role==='nav'?NV.walk.x:W.x,wy=role==='nav'?NV.walk.y:W.y;
    if(role==='nav'){NV.vx=NV.vx==null?wx:NV.vx+(wx-NV.vx)*.3;NV.vy=NV.vy==null?wy:NV.vy+(wy-NV.vy)*.3;if(Math.abs(wx-NV.vx)>3||Math.abs(wy-NV.vy)>3){NV.vx=wx;NV.vy=wy;}}
    const vx=role==='nav'?NV.vx:W.px,vy=role==='nav'?NV.vy:W.py;
    if(role==='nav'){ctx.save();ctx.beginPath();ctx.rect(g.ox,g.oy,cs*L.w,cs*L.h);ctx.clip();ctx.strokeStyle='rgba(255,140,30,.6)';ctx.setLineDash([5,5]);ctx.lineWidth=2;ctx.beginPath();ctx.arc(g.ox+(vx+.5)*cs,g.oy+(vy+.5)*cs,cs*2.4,0,7);ctx.stroke();ctx.restore();}
    drawWalker(ctx,vx,vy,cs,g.ox,g.oy,tms,W.dead);
    if(W.flash>0){ctx.fillStyle='rgba(224,72,58,'+(W.flash/900*.35)+')';ctx.fillRect(0,0,CW,CH);}
    if(role==='nav'&&!NV.started){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,CW,CH);}
    if(role==='solo'&&SO.memOn){ctx.fillStyle='rgba(20,10,0,.75)';ctx.fillRect(0,CH-0,CW,0);}
    return;
  }
  // ---- walker fog view ----
  ctx.fillStyle='#07050b';ctx.fillRect(0,0,CW,CH);
  const cs=Math.floor(Math.min(CW,CH)/6.4);
  const ox=CW/2-(W.px+.5)*cs,oy=CH/2-(W.py+.5)*cs;
  const fl=1+Math.sin(now/90)*.03+Math.sin(now/37)*.02;
  const R=2.35*fl;
  const x0=Math.max(0,Math.floor(W.px-4)),x1=Math.min(L.w-1,Math.ceil(W.px+4)),y0=Math.max(0,Math.floor(W.py-4)),y1=Math.min(L.h-1,Math.ceil(W.py+4));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const d=Math.hypot(x-W.px,y-W.py);if(d>R+.6)continue;
    const al=Math.max(0,Math.min(1,(R+.3-d)/1.5));
    const px=ox+x*cs,py=oy+y*cs;
    ctx.globalAlpha=al;
    ctx.fillStyle=PAL.floorW[(x+y)&1];ctx.fillRect(px,py,cs,cs);
    // grout
    ctx.strokeStyle='rgba(0,0,0,.25)';ctx.lineWidth=1;ctx.strokeRect(px+.5,py+.5,cs-1,cs-1);
    if(x===L.s[0]&&y===L.s[1]){ctx.fillStyle='rgba(80,200,150,.18)';ctx.fillRect(px,py,cs,cs);}
    ctx.globalAlpha=1;
    const c=fa[y*L.w+x];
    if(c!=='.')drawTile(ctx,c,px,py,cs,al,false,tms,gm,k);
    if(x===L.e[0]&&y===L.e[1])drawExit(ctx,px,py,cs,tms,al,false);
    ctx.globalAlpha=al;
    drawWalls(ctx,px,py,cs,L.wla[y*L.w+x],PAL.wallWd,Math.max(3,cs*.14),PAL.wallW);
    ctx.globalAlpha=1;
  }
  for(const gd of L.g){const p=guardPos(gd,(tickN%PERIOD)*TICK+(W.lt%TICK));const d=Math.hypot(p[0]-W.px,p[1]-W.py);if(d<R+.3)drawGuard(ctx,p[0],p[1],cs,ox,oy,tms,Math.max(0,Math.min(1,(R+.3-d)/1.5)));}
  for(const m of marks){const idx=(m/8)|0,mx=idx%L.w,my=(idx/L.w)|0;const d=Math.hypot(mx-W.px,my-W.py);if(d<R+.3)drawMark(ctx,m,cs,ox+mx*cs,oy+my*cs,false,tms,Math.max(0,Math.min(1,(R+.3-d)/1.2)));}
  drawWalker(ctx,W.px,W.py,cs,ox,oy,tms,W.dead);
  // torch glow + vignette
  const gx=CW/2+cs*.25,gy=CH/2;
  const rg=ctx.createRadialGradient(gx,gy,cs*.2,gx,gy,cs*R*1.05);
  rg.addColorStop(0,'rgba(255,170,60,.16)');rg.addColorStop(.5,'rgba(255,120,30,.05)');rg.addColorStop(1,'rgba(7,5,11,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,CW,CH);
  const vg=ctx.createRadialGradient(CW/2,CH/2,cs*R*.7,CW/2,CH/2,Math.max(CW,CH)*.7);vg.addColorStop(0,'rgba(7,5,11,0)');vg.addColorStop(1,'rgba(7,5,11,.95)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,CW,CH);
  if(W.flash>0){ctx.fillStyle='rgba(224,40,30,'+(W.flash/900*.55)+')';ctx.fillRect(0,0,CW,CH);}
  if(role==='walker'&&!W.go){ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(0,0,CW,CH);}
  if(role==='solo'&&!SO.memOn&&!W.go&&!ov_on()){}
  if(role==='solo'&&SO.memOn){}
}
function ov_on(){return $('ov').classList.contains('on');}
requestAnimationFrame(draw);
// solo memorize banner
setInterval(()=>{if(L&&role==='solo'&&SO.memOn&&screen==='game'){$('hName').textContent=curLvl+'. Запомни! '+Math.max(0,Math.ceil(SO.mem));}else if(L&&screen==='game')$('hName').textContent=curLvl+'. '+L.name;},200);
// skip memorize by tapping stage
$('stage').addEventListener('pointerdown',()=>{if(role==='solo'&&SO.memOn&&SO.mem<L.w*.5+3-0.8)SO.mem=0;});
// test hooks
window.__lab={sim(d,gm){SO.gm=gm;tickN++;want=d;walkTick();},freeze(){SO.memOn=0;W.go=0;},get role(){return role;},get W(){return W;},get NV(){return NV;},get L(){return L;},get fa(){return fa;},get net(){return net;},get screen(){return screen;},get level(){return curLvl;},get fin(){return finShown;},toggleSwitch,pickLevel,get prog(){return prog;},get paused(){return paused;}};
window.addEventListener('resize',resize);
show('title');resize();
})();
</script>
