<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f1a14">
<title>Артиллерия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f1a14;--paper:#f1e4c3;--paper2:#e4d3a8;--red:#d9391f;--red2:#8e2412;--mus:#e8a91d;--olive:#56642f;--teal:#2a8fbd;--teal2:#17566f;
--hd:'Russo One',Impact,'Arial Black',sans-serif;--bd:'Oswald','Arial Narrow','Roboto Condensed',sans-serif;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;overscroll-behavior:none;font-family:var(--bd);color:var(--ink);touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:flex}
/* ---------- заставка ---------- */
#title{flex-direction:column;align-items:center;justify-content:center;background:#e9d9ae;padding:calc(var(--sat) + 12px) calc(var(--sar) + 16px) calc(var(--sab) + 12px) calc(var(--sal) + 16px);overflow:hidden}
#tcv{position:absolute;inset:0;width:100%;height:100%}
.tbox{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;width:min(380px,100%);max-height:100%}
.logo{font-family:var(--hd);font-size:clamp(40px,11.5vw,66px);line-height:.95;color:var(--red);text-align:center;transform:rotate(-3deg);text-shadow:3px 3px 0 var(--ink),6px 6px 0 var(--mus);letter-spacing:1px;margin:0 0 6px;animation:logo 3.4s ease-in-out infinite}
@keyframes logo{50%{transform:rotate(-1.6deg) scale(1.03)}}
.tag{font-size:15px;letter-spacing:3px;text-transform:uppercase;background:var(--ink);color:var(--paper);padding:4px 12px;transform:rotate(1.5deg);margin-bottom:8px}
.bigbtn{width:100%;min-height:58px;font-family:var(--hd);font-size:19px;letter-spacing:.5px;text-transform:uppercase;background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--ink);padding:10px 14px;transition:transform .08s,box-shadow .08s;position:relative}
.bigbtn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.bigbtn.red{background:var(--red);color:#fff}
.bigbtn small{display:block;font-family:var(--bd);font-size:13px;letter-spacing:1px;opacity:.75;text-transform:none;margin-top:2px}
.tlinks{display:flex;justify-content:space-between;width:100%;margin-top:4px}
.lnk{font-size:15px;color:var(--ink);text-decoration:none;font-weight:700;background:rgba(241,228,195,.85);border:2px solid var(--ink);padding:6px 10px;border-radius:4px;min-height:36px;display:inline-flex;align-items:center}
/* ---------- выбор полей ---------- */
#levels{flex-direction:column;background:var(--paper);background-image:linear-gradient(rgba(31,26,20,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(31,26,20,.07) 1px,transparent 1px);background-size:24px 24px;padding:calc(var(--sat) + 8px) calc(var(--sar) + 12px) 0 calc(var(--sal) + 12px)}
.lhead{display:flex;align-items:center;gap:10px;padding:4px 0 8px}
.lhead h2{font-family:var(--hd);font-size:22px;margin:0;flex:1;line-height:1.05;text-transform:uppercase}
.lhead h2 small{display:block;font-family:var(--bd);font-size:13px;color:var(--red2);letter-spacing:1px}
.sq{width:44px;height:44px;border:3px solid var(--ink);background:var(--paper);border-radius:6px;font-size:20px;font-weight:700;box-shadow:3px 3px 0 var(--ink);display:flex;align-items:center;justify-content:center}
.sq:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.lgrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;align-content:start;padding:4px 4px calc(var(--sab) + 18px) 2px;touch-action:pan-y}
.tile{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:6px;box-shadow:4px 4px 0 var(--ink);overflow:hidden;text-align:left;display:flex;flex-direction:column;min-height:104px}
.tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.tile canvas{width:100%;height:58px;display:block;border-bottom:3px solid var(--ink);background:#888}
.tile .no{position:absolute;left:0;top:0;background:var(--red);color:#fff;font-family:var(--hd);font-size:15px;padding:2px 8px 1px;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.tile .nm{font-size:13px;font-weight:700;line-height:1.1;padding:4px 6px 2px;text-transform:uppercase;flex:1}
.tile .st{font-size:13px;padding:0 6px 4px;color:var(--mus);text-shadow:0 0 1px var(--ink),1px 1px 0 var(--ink);letter-spacing:1px;min-height:18px}
.tile .nw{position:absolute;right:3px;top:3px;background:var(--mus);border:2px solid var(--ink);font-size:10px;font-weight:700;padding:0 4px;border-radius:3px;line-height:15px}
.tile.lock{filter:grayscale(1) brightness(.85);opacity:.75}
.tile.lock::after{content:'🔒';position:absolute;left:50%;top:22px;transform:translateX(-50%);font-size:24px}
.tile.cur{outline:4px solid var(--mus)}
/* ---------- бой ---------- */
#play{background:#16120e;flex-direction:column;touch-action:none;padding:var(--sat) var(--sar) var(--sab) var(--sal)}
#hud{display:flex;align-items:center;gap:8px;padding:6px 8px;color:var(--paper);flex:none}
.pl{flex:1;min-width:0;border-bottom:4px solid transparent;padding-bottom:2px;transition:border-color .2s}
.pl.act{border-color:var(--mus)}
.pl .row{display:flex;align-items:baseline;justify-content:space-between;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.pl .row b{overflow:hidden;text-overflow:ellipsis}
.pl .row span{font-family:var(--hd);font-size:15px}
.pl .bar{height:10px;border:2px solid var(--paper);border-radius:2px;background:#000;overflow:hidden;margin-top:2px}
.pl .bar i{display:block;height:100%;width:100%;transition:width .35s}
.pl.p0 .bar i{background:var(--red)}.pl.p1 .bar i{background:var(--teal)}
.pl.p1 .row{flex-direction:row-reverse}
.pl .shl{display:inline-block;margin-left:5px;color:var(--mus)}
#wind{flex:none;width:76px;text-align:center;font-family:var(--hd);line-height:1}
#wind small{display:block;font-family:var(--bd);font-size:11px;letter-spacing:2px;color:#b9ac8a}
#wind div{font-size:17px;color:var(--mus);margin-top:2px;white-space:nowrap}
#stage{position:relative;flex:none;width:100%;aspect-ratio:3/2;min-height:0;overflow:hidden}
#cv{position:absolute;left:0;top:0;display:block;touch-action:none}
#banner{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.8);font-family:var(--hd);font-size:clamp(16px,5.6vw,30px);text-transform:uppercase;color:var(--paper);background:var(--ink);border:3px solid var(--mus);padding:6px 16px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:4;max-width:96%}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#bMenu{position:absolute;left:6px;top:6px;width:44px;height:44px;border:3px solid var(--ink);background:var(--paper);border-radius:6px;font-weight:700;font-size:20px;z-index:5;opacity:.92}
.ctl{display:flex;flex-direction:column;gap:8px;padding:8px 10px;flex:none}
.wgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.wb{position:relative;min-height:50px;border:3px solid var(--ink);background:var(--paper);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-size:11px;font-weight:700;text-transform:uppercase;line-height:1.05;color:var(--ink)}
.wb svg{width:22px;height:22px;fill:currentColor}
.wb.sel{background:var(--mus);box-shadow:0 0 0 3px var(--paper)}
.wb.off{opacity:.38;filter:grayscale(1)}
.wb .cnt{position:absolute;right:2px;top:0;font-size:11px;font-family:var(--hd)}
.wb .lk{position:absolute;inset:auto 0 1px 0;font-size:9px}
.r2{display:flex;gap:8px;align-items:stretch}
.stp{flex:1;display:flex;align-items:stretch;gap:5px;min-width:0}
.stp .v{flex:1;text-align:center;color:var(--paper);display:flex;flex-direction:column;justify-content:center;line-height:1;min-width:0}
.stp .v small{font-size:11px;letter-spacing:2px;color:#b9ac8a}
.stp .v b{font-family:var(--hd);font-size:24px;font-weight:400}
.pb{width:50px;min-height:50px;border:3px solid var(--ink);background:var(--paper);border-radius:6px;font-family:var(--hd);font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:3px 3px 0 #000}
.pb:active,.pb.dn{background:var(--mus)}
.pb.off,#fire.off{opacity:.4}
#fire{flex:1.3;min-height:54px;border:3px solid var(--ink);background:var(--red);color:#fff;border-radius:6px;font-family:var(--hd);font-size:24px;letter-spacing:1px;text-transform:uppercase;box-shadow:4px 4px 0 #000;text-shadow:2px 2px 0 var(--red2)}
#fire:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.fuel{flex:1;height:8px;border:2px solid var(--paper);background:#000;border-radius:2px;align-self:center;overflow:hidden}
.fuel i{display:block;height:100%;background:var(--olive);width:100%}
#pull{position:fixed;inset:0;pointer-events:none;z-index:6;width:100%;height:100%;display:none}
/* ---------- окна ---------- */
.ov{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(20,16,12,.78);padding:calc(var(--sat) + 12px) calc(var(--sar) + 14px) calc(var(--sab) + 12px) calc(var(--sal) + 14px);overflow-y:auto}
.ov.on{display:flex}
.card{background:var(--paper);border:4px solid var(--ink);box-shadow:7px 7px 0 var(--red);border-radius:8px;padding:18px 16px 16px;width:min(360px,100%);margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px}
.card h3{font-family:var(--hd);font-size:30px;line-height:1;margin:0;color:var(--red);text-shadow:2px 2px 0 var(--ink);text-transform:uppercase}
.card p{margin:0;font-size:17px;line-height:1.25}
.card .bigbtn{min-height:50px;font-size:16px}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 20px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);border:3px solid var(--mus);padding:8px 16px;font-weight:700;font-size:16px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#rot{display:none}
/* ---------- альбомная ориентация ---------- */
@media (orientation:landscape) and (max-height:600px){
 #play{display:none;flex-direction:row;flex-wrap:wrap}
 #play.on{display:grid;grid-template-columns:minmax(104px,1fr) auto minmax(104px,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"hud hud hud" "cl st cr"}
 #hud{grid-area:hud;padding:3px 8px}
 #stage{grid-area:st;width:auto;height:100%;aspect-ratio:3/2;align-self:center;max-width:calc(100vw - 2*104px - var(--sal) - var(--sar))}
 #ctlL{grid-area:cl;justify-content:center;padding:4px 6px}#ctlR{grid-area:cr;justify-content:center;padding:4px 6px}
 .wgrid{grid-template-columns:repeat(2,1fr)}
 .wb{min-height:42px;flex-direction:row;gap:4px;font-size:10px}.wb svg{width:18px;height:18px}.wb span.t{display:none}
 .pb{width:44px;min-height:42px}.stp .v b{font-size:20px}
 #fire{min-height:56px;flex:none}
 .r2.stack{flex-direction:column}
 #hud .row{font-size:12px}
 #wind{width:84px}
}
@media (orientation:landscape) and (max-height:600px){
 .scr.on#title .tbox{flex-direction:column;gap:8px}
 .logo{font-size:44px;margin:0}.tag{margin-bottom:2px}
 .bigbtn{min-height:46px;padding:6px}
 .tbox{width:min(420px,100%)}
}
</style>
</head>
<body>
<div id="app">
 <section id="title" class="scr on">
  <canvas id="tcv"></canvas>
  <div class="tbox">
   <div class="tag">дуэль на разрушаемой земле</div>
   <h1 class="logo">АРТИЛ&shy;ЛЕРИЯ</h1>
   <button class="bigbtn red" id="bNet">Играть вдвоём по сети<small>два телефона · код комнаты</small></button>
   <button class="bigbtn" id="bHot">Один телефон: вдвоём<small>передаём друг другу</small></button>
   <button class="bigbtn" id="bBot">Против бота<small>тренировка и одиночная игра</small></button>
   <div class="tlinks"><a class="lnk" href="../">← Все игры</a><button class="lnk" id="bSnd">🔊 Звук</button></div>
  </div>
 </section>
 <section id="levels" class="scr">
  <div class="lhead"><button class="sq" id="lBack" aria-label="Назад">←</button><h2>Поля сражений<small id="lSub"></small></h2><button class="sq" id="lSnd">🔊</button></div>
  <div class="lgrid" id="lgrid"></div>
 </section>
 <section id="play" class="scr">
  <div id="hud">
   <div class="pl p0" id="pl0"><div class="row"><b id="n0">Игрок 1</b><span id="h0">100</span></div><div class="bar"><i id="b0"></i></div></div>
   <div id="wind"><small>ВЕТЕР</small><div id="wv">0</div></div>
   <div class="pl p1" id="pl1"><div class="row"><b id="n1">Игрок 2</b><span id="h1">100</span></div><div class="bar"><i id="b1"></i></div></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="banner"></div><button id="bMenu" aria-label="Меню">☰</button></div>
  <div class="ctl" id="ctlL">
   <div class="wgrid" id="wgrid"></div>
   <div class="r2"><button class="pb" id="mvL">◀</button><div class="fuel"><i id="fuel"></i></div><button class="pb" id="mvR">▶</button></div>
  </div>
  <div class="ctl" id="ctlR">
   <div class="r2 stack">
    <div class="stp"><button class="pb" id="aM">−</button><div class="v"><small>УГОЛ</small><b id="aV">45°</b></div><button class="pb" id="aP">+</button></div>
    <div class="stp"><button class="pb" id="pM">−</button><div class="v"><small>СИЛА</small><b id="pV">60</b></div><button class="pb" id="pP">+</button></div>
   </div>
   <button id="fire">Огонь!</button>
  </div>
  <svg id="pull" xmlns="http://www.w3.org/2000/svg"><line id="pl_l" stroke="#e8a91d" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9"/><circle id="pl_a" r="9" fill="#f1e4c3" stroke="#1f1a14" stroke-width="3"/><circle id="pl_b" r="16" fill="none" stroke="#e8a91d" stroke-width="3"/></svg>
  <div class="ov" id="ovPause"><div class="card"><h3>Пауза связи</h3><p id="pauseTxt">Партнёр отключился, ждём…</p><button class="bigbtn" id="pauseOut">Выйти в меню</button></div></div>
  <div class="ov" id="ovMenu"><div class="card"><h3>Меню</h3><button class="bigbtn red" id="mCont">Продолжить</button><button class="bigbtn" id="mSnd">Звук: вкл</button><button class="bigbtn" id="mLv">К выбору полей</button><button class="bigbtn" id="mOut">В главное меню</button></div></div>
  <div class="ov" id="ovRes"><div class="card"><h3 id="rT">Победа!</h3><p id="rP"></p><button class="bigbtn red" id="rNext">Следующее поле</button><button class="bigbtn" id="rAgain">Реванш</button><button class="bigbtn" id="rLv">К полям</button></div></div>
 </section>
</div>
<div id="toast"></div>
<script src="../shared/duo.js"></script>
<script>
//==SIM-START==
const W=720,H=480,WIND_K=0.0022,HP0=100;
const WU=[1,3,6,9,12,15];            // с какого поля доступно оружие
const AMMO=[99,5,4,3,3,2];
function rng(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function hash(a,b){let h=Math.imul(a^0x9e3779b9,0x85ebca6b)^Math.imul((b|0)+0x7f4a7c15,0xc2b2ae35);h^=h>>>13;h=Math.imul(h,0x27d4eb2f);h^=h>>>15;return h>>>0;}
// hills: [x,высота,ширина]; walls: [x,y,w,h] несокрушимые; isl: [cx,cy,rx,ry] парящие острова; carve: [x,y,r]
const LEVELS=[
{n:'Первая позиция',th:'meadow',seed:11,g:.12,wind:0,base:.66,amp:14,tx:[70,650]},
{n:'Лёгкий бриз',th:'meadow',seed:12,g:.12,wind:3,base:.64,amp:22,hills:[[360,40,90]],tx:[70,650]},
{n:'Овраг',th:'meadow',seed:3,g:.12,wind:4,base:.6,amp:20,hills:[[360,-110,70]],tx:[70,650]},
{n:'Холм',th:'meadow',seed:4,g:.12,wind:5,base:.68,amp:12,hills:[[360,150,95]],tx:[70,650]},
{n:'Дюны',th:'desert',seed:5,g:.12,wind:6,base:.62,amp:38,rough:2.2,tx:[70,650]},
{n:'Каменная стена',th:'desert',seed:6,g:.12,wind:5,base:.66,amp:14,walls:[[348,170,24,310]],tx:[70,650]},
{n:'Плато',th:'desert',seed:7,g:.12,wind:7,base:.6,amp:70,step:36,tx:[70,650]},
{n:'Снежные склоны',th:'snow',seed:8,g:.12,wind:8,base:.66,amp:40,hills:[[200,60,70],[520,70,80]],tx:[70,650]},
{n:'Озеро',th:'meadow',seed:9,g:.12,wind:6,base:.58,amp:16,hills:[[360,-170,150]],water:384,tx:[70,650]},
{n:'Бурный залив',th:'dusk',seed:10,g:.12,wind:9,base:.58,amp:16,hills:[[360,-170,160]],water:384,walls:[[352,230,16,250]],tx:[70,650]},
{n:'Лунная база',th:'moon',seed:21,g:.06,wind:0,base:.66,amp:20,carve:[[200,310,40],[520,330,50],[360,360,60]],tx:[70,650]},
{n:'Лунные скалы',th:'moon',seed:22,g:.06,wind:0,base:.68,amp:18,walls:[[250,230,22,250],[470,200,22,280]],tx:[70,650]},
{n:'Парящие острова',th:'sky',seed:13,g:.12,wind:6,noground:1,isl:[[110,330,92,44],[610,330,92,44],[360,300,70,34]],tx:[110,610],ty:[250,250]},
{n:'Небесный мост',th:'sky',seed:14,g:.12,wind:7,noground:1,isl:[[100,340,88,46],[620,340,88,46],[262,335,46,22],[458,335,46,22],[360,296,30,16]],walls:[[354,90,12,160]],tx:[100,620],ty:[250,250]},
{n:'Вулкан',th:'volcano',seed:15,g:.12,wind:7,base:.68,amp:12,hills:[[360,230,110],[170,-130,50],[550,-130,50]],water:440,tx:[60,660]},
{n:'Ущелье',th:'desert',seed:16,g:.14,wind:8,base:.5,amp:16,hills:[[360,-210,80]],tx:[70,650]},
{n:'Ледяной бастион',th:'snow',seed:17,g:.12,wind:10,base:.68,amp:12,hills:[[360,110,60],[200,50,40],[520,50,40]],walls:[[352,150,16,330]],tx:[70,650]},
{n:'Ночной город',th:'night',seed:18,g:.12,wind:8,base:.72,amp:3,walls:[[130,350,40,130],[200,300,34,180],[300,330,30,150],[358,240,26,240],[430,320,32,160],[520,290,38,190],[590,350,36,130]],tx:[50,670]},
{n:'Крепость',th:'dusk',seed:19,g:.12,wind:4,base:.7,amp:6,walls:[[104,264,16,216],[270,200,18,280],[432,200,18,280],[600,264,16,216]],tx:[56,664]},
{n:'Последний рубеж',th:'volcano',seed:20,g:.10,wind:12,base:.6,amp:26,hills:[[360,-170,80]],water:404,walls:[[352,140,16,340]],isl:[[200,190,50,20],[520,190,50,20]],tx:[60,660]}
];
LEVELS.forEach((L,i)=>{L.i=i+1;L.bot=Math.max(.6,5-4.4*i/19);});
function windFor(L,id,n){if(!L.wind)return 0;const r=rng(hash(id%1000003,n+7));r();return Math.round((r()*2-1)*L.wind);}
function gy(T,x,y0){x=x<0?0:x>=W?W-1:Math.round(x);for(let y=Math.max(0,Math.round(y0));y<H;y++)if(T[y*W+x])return y;return 9999;}
function settleY(T,x,y0){return Math.min(gy(T,x-6,y0),gy(T,x+6,y0));}
function genLevel(L){

// вырезает круг или «капсулу»; возвращает рамку для перерисовки
function carve(T,x,y,r,x2,y2){
  const pts=[];
  if(x2===undefined)pts.push([x,y]);else{const n=Math.max(1,Math.ceil(Math.hypot(x2-x,y2-y)/2));for(let i=0;i<=n;i++)pts.push([x+(x2-x)*i/n,y+(y2-y)*i/n]);}
  let b=[W,H,0,0];
  for(const[px,py]of pts){const cx=Math.round(px),cy=Math.round(py);
    for(let yy=Math.max(0,cy-r);yy<=Math.min(H-1,cy+r);yy++){const dx=Math.floor(Math.sqrt(r*r-(yy-cy)*(yy-cy)));
      for(let xx=Math.max(0,cx-dx);xx<=Math.min(W-1,cx+dx);xx++)if(T[yy*W+xx]===1)T[yy*W+xx]=0;}
    b=[Math.min(b[0],cx-r),Math.min(b[1],cy-r),Math.max(b[2],cx+r),Math.max(b[3],cy+r)];}
  return b;
}
function advance(S,P){

    if(P.x<-40||P.x>W+40||P.y>H+40)return{t:'out',x:P.x,y:P.y};
    if(S.water&&P.y>=S.water)return{t:'water',x:P.x,y:S.water};
    if(P.y>=0&&P.x>=0&&P.x<W&&P.y<H&&S.T[(P.y|0)*W+(P.x|0)])return{t:'ground',x:P.x,y:P.y};
    for(let k=0;k<2;k++){const t=S.tanks[k];if(t.hp<=0||(k===S.sh&&P.f<12))continue;

}

function botAim(base,sh,wind,err,rnd){

    let d=Math.hypot(e.x-tcx,e.y-tcy);

}

function thumb(l){

function baseOf(){return{T:M.T,water:M.water,g:M.L.g,tanks:M.tanks};}

function beginPlayback(rec){
  if(!M||M.phase!=='aim')return;
  const t=M.tanks[rec.s];t.x=rec.x;t.y=rec.y;t.tx=rec.x;t.ty=rec.y;t.a=rec.a;t.p=rec.p;t.w=rec.w;
  if(rec.w>0&&t.am[rec.w]>0)t.am[rec.w]--;
  M.shots[rec.s]++;M.phase='fly';M.bot=null;
  let end=0;rec.tr.forEach(q=>{end=Math.max(end,q.e);});rec.ev.forEach(e=>{end=Math.max(end,e[0]);});
  M.pb={rec,f:0,ei:0,di:0,end:end+(rec.w===5?30:12),sf:-1,from:M.tanks.map(q=>[q.x,q.y])};
  t.rec=5;
  if(rec.w===5){SFX.shield();floatTxt(t.x,t.y-26,'ЩИТ','#8fe3ff');}
  else{SFX.shot();
    const q=muzzle(t,rec.a,rec.p);for(let i=0;i<8;i++)addP('f',q.x,q.y,Math.cos(rec.a*.01745)*(1+Math.random()*2)+(Math.random()-.5),-Math.sin(rec.a*.01745)*(1+Math.random()*2)+(Math.random()-.5),14+Math.random()*8,3);}
  syncUI();hudUpdate();

function trPos(q,f){
  const n=q.p.length/2,rel=f-q.s;let j=Math.floor(rel/3);
  if(j>=n-1)return[q.p[(n-1)*2],q.p[(n-1)*2+1]];
  const t0=q.s+j*3,t1=(j+1>=n-1)?q.e:t0+3,k=Math.max(0,Math.min(1,(f-t0)/Math.max(1,t1-t0)));
  return[q.p[j*2]+(q.p[j*2+2]-q.p[j*2])*k,q.p[j*2+1]+(q.p[j*2+3]-q.p[j*2+1])*k];
}
function addP(k,x,y,vx,vy,life,r,col){parts.push({k,x,y,vx,vy,life,max:life,r,col});}

function boom(x,y,r){

  const th=TH[M.L.th];for(let i=0;i<8+r/3;i++){const a=-Math.PI*(.1+Math.random()*.8),s=1.5+Math.random()*(r/7+1.5);addP('d',x,y,Math.cos(a)*s,Math.sin(a)*s,40+Math.random()*25,1.5+Math.random()*2,th.soil);}
  parts.push({k:'r',x,y,vx:0,vy:0,life:16,max:16,r});
  shake=Math.max(shake,Math.min(9,r/4.5));SFX.boom(r);
}
function doEvent(e){
  const[f,x,y,r,kind,x2,y2]=e;
  if(kind===0){const b=carve(M.T,x,y,r);paintTerr(b[0]-2,b[1]-2,b[2]+2,b[3]+2);boom(x,y,r);}
  else if(kind===1){const b=carve(M.T,x,y,r,x2,y2);paintTerr(b[0]-2,b[1]-2,b[2]+2,b[3]+2);SFX.drill();for(let i=0;i<14;i++){const k=Math.random();addP('d',x+(x2-x)*k,y+(y2-y)*k,(Math.random()-.5)*2,-Math.random()*2,30,2,TH[M.L.th].soil);}}
  else if(kind===2){SFX.splash();for(let i=0;i<14;i++)addP('w',x,y,(Math.random()-.5)*3,-2-Math.random()*3,30,2);}
}
function killTank(k){const t=M.tanks[k];if(t.dead)return;t.dead=1;t.hp=0;boom(t.x,t.y-6,48);for(let i=0;i<10;i++)addP('d',t.x,t.y-6,(Math.random()-.5)*5,-Math.random()*5,60,2.5,k?'#2a8fbd':'#d9391f');}
function pbStep(){
  const pb=M.pb,rec=pb.rec;
  if(pb.sf<0){
    pb.f++;const f=pb.f;
    while(pb.ei<rec.ev.length&&rec.ev[pb.ei][0]<=f)doEvent(rec.ev[pb.ei++]);
    while(pb.di<rec.dm.length&&rec.dm[pb.di][0]<=f){const[,k,d]=rec.dm[pb.di++],t=M.tanks[k];
      if(d>0){t.hp=Math.max(0,t.hp-d);floatTxt(t.x,t.y-24,'−'+d,'#ffd27a');if(t.hp<=0)killTank(k);}else floatTxt(t.x,t.y-24,'щит!','#8fe3ff');}
    if(f%2===0)rec.tr.forEach(q=>{if(f>=q.s&&f<q.e&&q.k!=='m'){const p=trPos(q,f);addP('s',p[0],p[1],0,0,16,2.2);}});
    if(f>=pb.end)pb.sf=0;
  }else{
    pb.sf++;const k=Math.min(1,pb.sf/30),e=k*k*(3-2*k);
    M.tanks.forEach((t,i)=>{if(t.dead)return;t.x=pb.from[i][0]+(rec.tx[i][0]-pb.from[i][0])*e;t.y=pb.from[i][1]+(rec.tx[i][1]-pb.from[i][1])*e;});

  }

function pbDone(){

function matchResult(){
  const o=M.over,L=M.level;let ttl,sub='',won=false;
  const sh=M.shots;
  if(o===2){ttl='Ничья!';sub='Оба танка уничтожены.';}
  else{
    if(G.mode==='net'){won=o===G.side;ttl=won?'Победа!':'Партнёр победил';}
    else if(G.mode==='bot'){won=o===0;ttl=won?'Победа!':'Бот победил';}
    else{won=true;ttl='Игрок '+(o+1)+' победил!';}
    if(G.mode==='net')SV.wins[L]=(SV.wins[L]||0)+(o===G.side?1:0);
    else if(G.mode==='bot'&&o===0)SV.wins[L]=(SV.wins[L]||0)+1;
    const mine=G.mode==='net'?G.side:0;
    if(o===mine&&G.mode!=='hot'){const b=SV.best[L];if(!b||sh[o]<b)SV.best[L]=sh[o];}
    const nu=Math.min(20,L+1);
    if(nu>SV.u){SV.u=nu;sub='Открыто поле '+nu+(WU.indexOf(nu)>0?' · новое оружие: '+WNAME[WU.indexOf(nu)]:'')+'. ';}
    sub+='Выстрелов: '+sh[o]+'.';
    persist();
  }
  $('rT').textContent=ttl;$('rP').textContent=sub||' ';
  $('rNext').style.display=(o!==2&&L<20)?'':'none';
  $('ovRes').classList.add('on');
  if(o!==2&&(G.mode==='hot'||won))SFX.win();else SFX.lose();
}

function publishAim(force){
  if(G.mode!=='net'||!M||M.phase!=='aim'||cur()!==G.side)return;
  const now=performance.now();if(!force&&now-lastAimSend<70){aimDirty=1;return;}
  lastAimSend=now;aimDirty=0;const t=M.tanks[G.side];
  Duo.set({aim:{m:M.id,n:M.n,a:Math.round(t.a),p:Math.round(t.p),w:t.w,x:Math.round(t.x),y:Math.round(t.y)}});
}
function applySel(level,ep){

  startMatch(level,ep);

function sendSel(level){
  const p=Duo.partner(),pe=p&&p.sel?p.sel.ep:0;
  const ep=Math.max(Date.now(),pe+1,handledEp+1);handledEp=ep;

function netPoll(){
  const p=Duo.partner();if(!p)return;
  if(p.pg&&typeof p.pg==='object'){PG=p.pg;if((p.pg.u|0)>SV.u){SV.u=Math.min(20,p.pg.u|0);persist();if(S_screen==='levels')refreshLevels();}}
  if(p.sel&&p.sel.ep>handledEp){handledEp=p.sel.ep;applySel(p.sel.level|0,p.sel.ep);return;}
  if(M&&M.phase==='aim'&&cur()!==G.side){
    if(p.mv&&p.mv.m===M.id&&p.mv.n===M.n){beginPlayback(p.mv);return;}
    const a=p.aim,t=M.tanks[cur()];
    if(a&&a.m===M.id&&a.n===M.n){t.a=a.a;t.p=a.p;if(a.w>=0&&a.w<6)t.w=a.w;t.tx=a.x;t.ty=a.y;}
  }

function netEnter(){
  if(G.mode==='net')return;
  G.mode='net';G.side=Duo.isHost()?0:1;
  const p=Duo.partner();handledEp=Math.max(handledEp,p&&p.sel?p.sel.ep:0);

function moveTank(dir){

function botTick(){
  if(G.mode!=='bot'||!M||M.phase!=='aim'||cur()!==1||paused||M.menu){return;}
  const b=M.bot||(M.bot={t:0,st:0}),t=M.tanks[1];b.t++;
  if(b.st===0&&b.t>75){
    const pl=botAim(baseOf(),1,M.wind,M.L.bot,Math.random);
    const av=[1,2,3,4].filter(w=>weaponOK(w)&&t.am[w]>0);
    let w=0;if(M.L.i>=15&&t.am[5]>0&&t.hp<40&&Math.random()<.5)w=5;else if(av.length&&Math.random()<.55)w=av[Math.floor(Math.random()*av.length)];
    t.w=w;b.a=pl.a;b.p=pl.p;b.st=1;b.t=0;syncUI();
  }else if(b.st===1){
    t.a+=Math.sign(b.a-t.a)*Math.min(2,Math.abs(b.a-t.a));t.p+=Math.sign(b.p-t.p)*Math.min(1.5,Math.abs(b.p-t.p));
    if(b.t%4===0)syncUI();
    if(t.a===b.a&&t.p===b.p&&b.t>20){b.st=2;fireNow();}
  }
}
// ---------- шаг и рисование ----------
function tick(){
  tickN++;

    const was=paused;paused=(S_screen==='play'&&!Duo.linked());
    if(paused!==was){$('pauseTxt').textContent='Партнёр отключился, ждём…';$('ovPause').classList.toggle('on',paused);if(M)syncUI();}
    netPoll();

  }

  if(!M||S_screen!=='play')return;
  if(paused)return;

  }else if(M.phase==='over'&&M.endT>0){if(--M.endT===0)matchResult();}

    t.hpv+=(t.hp-t.hpv)*.1;if(t.rec>0)t.rec-=.5;
    if(!t.dead&&M.phase!=='fly'||tickN%3===0){const yl=gy(M.T,t.x-6,t.y-8),yr=gy(M.T,t.x+6,t.y-8);if(yl<9999&&yr<9999){const tt=Math.max(-.7,Math.min(.7,Math.atan2(yr-yl,12)));t.tilt+=(tt-t.tilt)*.25;}}
  });
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;if(p.k==='d'||p.k==='w')p.vy+=.12;p.life--;if(p.k==='s')p.r+=.12;if(p.life<=0)parts.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){floats[i].t++;if(floats[i].t>70)floats.splice(i,1);}
  if(shake>0)shake=Math.max(0,shake-.35);
  if(tickN%6===0)hudUpdate();
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function drawTank(c,t,i,active,pal){
  if(t.dead)return;
  const col=pal||(i?['#2a8fbd','#17566f']:['#d9391f','#8e2412']);
  c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.ellipse(t.x,t.y+.5,13,2.5,0,0,7);c.fill();
  c.save();c.translate(t.x,t.y);c.rotate(t.tilt||0);c.lineWidth=1.5;c.strokeStyle='#1f1a14';c.lineJoin='round';
  c.fillStyle='#2b2620';rr(c,-12,-6.5,24,7,3);c.fill();c.stroke();
  c.fillStyle='#8a7f6c';for(let k=-8;k<=8;k+=4){c.beginPath();c.arc(k,-3,1.7,0,7);c.fill();}
  c.fillStyle=col[0];c.beginPath();c.moveTo(-10,-5.5);c.lineTo(10,-5.5);c.lineTo(8,-10);c.lineTo(-8,-10);c.closePath();c.fill();c.stroke();
  c.fillStyle=col[1];c.fillRect(-9,-7.6,18,1.6);
  c.restore();

  c.save();c.translate(t.x,t.y-9.5);c.rotate(-ang);c.lineWidth=1.4;
  c.fillStyle=col[1];c.fillRect(-(t.rec>0?t.rec*.5:0),-1.8,16,3.6);c.strokeRect(-(t.rec>0?t.rec*.5:0),-1.8,16,3.6);c.fillStyle='#1f1a14';c.fillRect(13,-2.3,3.5,4.6);
  c.restore();
  c.fillStyle=col[0];c.beginPath();c.arc(t.x,t.y-9.5,5.2,0,7);c.fill();c.lineWidth=1.5;c.stroke();
  c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.arc(t.x-1.5,t.y-11,1.8,0,7);c.fill();
  if(t.sh){c.strokeStyle='rgba(143,227,255,'+(.6+.3*Math.sin(tickN*.2))+')';c.lineWidth=2;c.fillStyle='rgba(143,227,255,.18)';c.beginPath();c.arc(t.x,t.y-8,17,0,7);c.fill();c.stroke();}
  if(active){const by=Math.sin(tickN*.15)*2;c.fillStyle='#e8a91d';c.strokeStyle='#1f1a14';c.lineWidth=1.5;c.beginPath();c.moveTo(t.x,t.y-28+by);c.lineTo(t.x-5,t.y-35+by);c.lineTo(t.x+5,t.y-35+by);c.closePath();c.fill();c.stroke();}
}
function drawWorld(c,withUI){
  c.drawImage(bgc,0,0);

  c.globalAlpha=1;
  c.drawImage(tcv,0,0);
  if(M.water){const y=M.water,lv=th.lava;
    c.fillStyle=th.water;c.globalAlpha=lv?.9:.62;c.beginPath();c.moveTo(0,H);c.lineTo(0,y);

    c.lineTo(W,H);c.closePath();c.fill();c.globalAlpha=1;
    c.strokeStyle=lv?'#ffd27a':'rgba(255,255,255,.7)';c.lineWidth=2;c.beginPath();for(let x=0;x<=W;x+=8){const yy=y+Math.sin(x*.05+tickN*.06)*2.2;x?c.lineTo(x,yy):c.moveTo(x,yy);}c.stroke();}
  // снаряды

      if(q.k==='m'){c.fillStyle='#4a4a4a';c.beginPath();c.arc(p[0],p[1],5,0,7);c.fill();c.stroke();c.fillStyle=(f>>3)&1?'#ff3b2a':'#552';c.beginPath();c.arc(p[0],p[1]-1,1.8,0,7);c.fill();}
      else{const r=q.k==='b'?2.4:q.k==='c'?4:q.k==='d'?3.6:3.2;c.fillStyle=q.k==='d'?'#9aa0a8':q.k==='c'?'#e8a91d':q.k==='t'?'#f06a2a':'#2b2620';c.beginPath();c.arc(p[0],p[1],r,0,7);c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.6)';c.beginPath();c.arc(p[0]-r*.3,p[1]-r*.3,r*.35,0,7);c.fill();}});}
  M.tanks.forEach((t,i)=>drawTank(c,t,i,M.phase==='aim'&&cur()===i));
  // предпросмотр

    const t=M.tanks[cur()];
    if(t.w!==5){const P=muzzle(t,t.a,t.p),St={T:M.T,water:M.water,g:M.L.g,wind:M.wind,sh:cur(),tanks:M.tanks};
      for(let k=0;k<60;k++){const e=advance(St,P);if(e)break;if(k%4===3){c.fillStyle='rgba(255,246,200,'+(.95-k/70)+')';c.strokeStyle='rgba(31,26,20,.6)';c.lineWidth=1;c.beginPath();c.arc(P.x,P.y,2.2,0,7);c.fill();c.stroke();}}}
  }

}
function render(){
  if(S_screen==='play'&&M){
    const ow=cv.width,oh=cv.height;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#16120e';ctx.fillRect(0,0,ow,oh);
    const k=S*dpr,sx=shake?(Math.random()-.5)*shake*2:0,sy=shake?(Math.random()-.5)*shake*2:0;

function fit(){
  const st=$('stage'),w=st.clientWidth,h=st.clientHeight;if(!w||!h)return;
  dpr=Math.min(2,window.devicePixelRatio||1);S=Math.min(w/W,h/H);const cw=W*S,ch=H*S;

if(window.ResizeObserver)new ResizeObserver(fit).observe($('stage'));

const tc=$('tcv'),tx=tc.getContext('2d');let tShell=null,tBoom=null,tN=0;
function drawTitle(){
  const w=tc.clientWidth,h=tc.clientHeight,d=Math.min(2,window.devicePixelRatio||1);
  if(tc.width!==Math.round(w*d)||tc.height!==Math.round(h*d)){tc.width=Math.round(w*d);tc.height=Math.round(h*d);}
  tN++;tx.setTransform(d,0,0,d,0,0);tx.clearRect(0,0,w,h);

  tx.fillStyle='rgba(217,57,31,.9)';tx.save();tx.translate(w*.5,h*.5);tx.rotate(-.5);tx.fillRect(-w,-h*.07,w*2,h*.045);tx.fillRect(-w,h*.02,w*2,h*.02);tx.restore();
  tx.fillStyle='#56642f';tx.beginPath();tx.moveTo(0,h);for(let x=0;x<=w;x+=8)tx.lineTo(x,h*.84-Math.sin(x*.012+1)*h*.03-Math.sin(x*.03)*h*.012);tx.lineTo(w,h);tx.fill();
  tx.fillStyle='#1f1a14';tx.beginPath();tx.moveTo(0,h);for(let x=0;x<=w;x+=8)tx.lineTo(x,h*.92-Math.sin(x*.02+3)*h*.02);tx.lineTo(w,h);tx.fill();

    tBoom=null;}
  else{const k=(ph-.55)/.45,fromL=((tN/240)|0)%2===0,B=fromL?R:L;
    tx.globalAlpha=1-k;tx.fillStyle='#e8541a';tx.beginPath();tx.arc(B.x,B.y-8*sc,20*sc*k+4,0,7);tx.fill();tx.fillStyle='#ffd27a';tx.beginPath();tx.arc(B.x,B.y-8*sc,12*sc*k,0,7);tx.fill();tx.globalAlpha=1;}
}
// ---------- главный цикл ----------
let lastT=0,acc=0;
function loop(ts){
  const dt=Math.min(100,ts-(lastT||ts));lastT=ts;acc+=dt;
  let n=0;while(acc>=16.667&&n<6){tick();acc-=16.667;n++;}if(n>=6)acc=0;
